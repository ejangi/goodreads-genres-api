[package]
name = "goodreads-genres-api"
version = "1.5.0"
edition = "2021"

[dependencies]
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json"] }
scraper = "0.27.0"
tokio = { version = "1.53.1", features = ["full"] }
rocket = { version = "0.5.1", features = ["json", "msgpack", "uuid"] }

[[bin]]
name = "app"
path = "src/main.rs"
